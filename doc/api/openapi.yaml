openapi: 3.0.3
info:
  title: RubberDuck (Aikiduck) API
  description: REST API спецификация для хобби-проекта Aikiduck
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Локальный сервер разработки
paths:
  /api/health:
    get:
      summary: Проверка статуса работоспособности бэкенда
      responses:
        '200':
          description: Успешный ответ сервера
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  message:
                    type: string
                    example: "Aikiduck backend is running"
  /api/sessions:
    post:
      summary: Создать сессию чекина
      responses:
        '201':
          description: Сессия создана
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
                    minimum: 1
                    example: 1
        '500':
          $ref: '#/components/responses/ServerError'
  /api/sessions/{id}/state:
    post:
      summary: Сохранить выбранные состояния
      description: Повторный запрос заменяет состояния и текст сессии и обновляет updated_at.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emotions]
              properties:
                emotions:
                  $ref: '#/components/schemas/Emotions'
                user_text:
                  type: string
                  maxLength: 1000
                  default: ''
            example:
              emotions: [ANXIETY, CHAOS]
              user_text: ''
      responses:
        '200':
          description: Состояния сохранены
          content:
            application/json:
              schema:
                type: object
                required: [session_id, emotions, user_text]
                properties:
                  session_id:
                    type: integer
                  emotions:
                    $ref: '#/components/schemas/Emotions'
                  user_text:
                    type: string
        '400':
          description: Некорректный id, массив состояний или текст
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Сессия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  schemas:
    Emotions:
      type: array
      minItems: 1
      maxItems: 4
      uniqueItems: true
      items:
        type: string
        enum: [ANXIETY, GUILT, SHAME, FATIGUE, CHAOS, AVERSION, APATHY, IRRITATION, FROZEN, PERFECTIONISM]
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
  responses:
    ServerError:
      description: Внутренняя ошибка сохранения данных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
