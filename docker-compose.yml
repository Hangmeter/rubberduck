# version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rubberduck_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-rubberduck_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rubberduckrpass}
      POSTGRES_DB: ${DB_NAME:-rubberduck_db}
    ports:
      - "127.0.0.1:5452:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Скрипт инициализации таблиц (подмонтируем из проекта)
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rubberduck_network

  backend:
    image: node:22-alpine
    container_name: rubberduck_backend
    restart: always
    # На этапе скелета запускаем контейнер в режиме ожидания кода
    command: sh -c "cd /app && npm install --quiet && node server.js"
    ports:
      - "8100:8100" # Открываем веб-порт наружу
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://${DB_USER:-rubberduck_user}:${DB_PASSWORD:-rubberduckrpass}@db:5432/${DB_NAME:-rubberduck_db}
      - PORT=8100
      - NODE_ENV=development
    depends_on:
      - db
    networks:
      - rubberduck_network

volumes:
  postgres_data:

networks:
  rubberduck_network:
    driver: bridge
